<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% if acao == 'criar' %}Criar Evento{% else %}Editar Evento{% endif %}
    </title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div class="container mt-5">
      <div class="card shadow">
        <div class="card-body">
          <h3 class="card-title mb-4 text-center">
            {% if acao == 'criar' %} Criar novo evento {% else %} Editar evento
            {% endif %}
          </h3>

          <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
              <label for="titulo" class="form-label fw-semibold">Título</label>
              <input
                type="text"
                class="form-control"
                id="titulo"
                name="titulo"
                required
              />
            </div>

            <div class="mb-3">
              <label for="descricao" class="form-label fw-semibold"
                >Descrição</label
              >
              <textarea
                class="form-control"
                id="descricao"
                name="descricao"
                rows="3"
                placeholder="Adicione uma breve descrição..."
              ></textarea>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="inicio" class="form-label fw-semibold"
                  >Início</label
                >
                <input
                  type="datetime-local"
                  class="form-control"
                  id="inicio"
                  name="inicio"
                  required
                />
              </div>
              <div class="col-md-6 mb-3">
                <label for="fim" class="form-label fw-semibold">Fim</label>
                <input
                  type="datetime-local"
                  class="form-control"
                  id="fim"
                  name="fim"
                  required
                />
              </div>
            </div>

            <div class="text-center mt-4">
              <button type="submit" class="btn btn-success px-4">
                {% if acao == 'criar' %}Salvar{% else %}Atualizar{% endif %}
              </button>
              <a
                href="{% url 'listar_eventos' %}"
                class="btn btn-secondary ms-2"
              >
                Cancelar
              </a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
