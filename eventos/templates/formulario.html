<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% if acao == 'editar' %}Editar evento{% else %}Criar novo evento{% endif
      %}
    </title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div class="container mt-5">
      <h2 class="mb-4 text-center">
        {% if acao == 'editar' %}Editar evento{% else %}Criar novo evento{%
        endif %}
      </h2>

      <form method="post" class="p-4 bg-white rounded shadow-sm">
        {% csrf_token %}

        <div class="mb-3">
          <label class="form-label">Título</label>
          <input
            type="text"
            name="titulo"
            class="form-control"
            value="{{ evento.titulo|default:'' }}"
            required
          />
        </div>

        <div class="mb-3">
          <label class="form-label">Descrição</label>
          <textarea name="descricao" class="form-control">
{{ evento.descricao|default:'' }}</textarea
          >
        </div>

        <div class="mb-3">
          <label class="form-label">Início</label>
          <input
            type="datetime-local"
            name="inicio"
            class="form-control"
            value="{{ evento.inicio|date:'Y-m-d\\TH:i'|default:'' }}"
            required
          />
        </div>

        <div class="mb-3">
          <label class="form-label">Fim</label>
          <input
            type="datetime-local"
            name="fim"
            class="form-control"
            value="{{ evento.fim|date:'Y-m-d\\TH:i'|default:'' }}"
            required
          />
        </div>

        <div class="d-flex justify-content-between">
          <a href="{% url 'listar_eventos' %}" class="btn btn-secondary"
            >Cancelar</a
          >
          <button type="submit" class="btn btn-success">Salvar</button>
        </div>
      </form>
    </div>
  </body>
</html>
